<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#14151d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Pixel Arena</title>
    <meta name="description" content="手機、電腦都能玩的即時多人像素對戰：四種角色、各有技能和大招，先拿 5 殺獲勝，也能跟電腦打。" />
    <!-- Open Graph：控制分享到 FB、LINE、Discord 時的預覽卡片；og:image 必須是完整網址（圖在 public/og.jpg） -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="像素競技場 Pixel Arena" />
    <meta property="og:description" content="手機、電腦都能玩的即時多人像素對戰：四種角色、各有技能和大招，先拿 5 殺獲勝，也能跟電腦打。" />
    <meta property="og:url" content="https://arena.holin.cc/" />
    <meta property="og:image" content="https://arena.holin.cc/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="app">
      <!-- 上方：狀態列 + 遊戲畫面 -->
      <header id="hud">
        <span id="status">載入中…</span>
        <div id="score"></div>
        <button id="mute" aria-label="靜音">🔊</button>
        <button id="share" hidden>邀請</button>
        <button id="leave" hidden>離開</button>
      </header>
      <main id="game">
        <!-- 進場畫面：輸入名稱、選角色（lobby.js） -->
        <form id="lobby" hidden>
          <div class="title">PIXEL ARENA</div>
          <label class="field">名稱
            <input id="lobby-name" maxlength="12" autocomplete="off" enterkeyhint="go" placeholder="輸入你的名稱" />
          </label>
          <div id="lobby-skins"></div>
          <!-- 三種進場方式，按哪個由 submit 事件的 submitter.value 判斷 -->
          <button id="lobby-join" type="submit" value="quick">快速配對<span class="pad-hint">（Ⓐ）</span></button>
          <button id="lobby-create" class="lobby-sub-btn" type="submit" value="create">🔒 建立私人房間<span class="pad-hint">（Ⓧ）</span></button>
          <div id="lobby-code-row">
            <input id="lobby-code" inputmode="numeric" autocomplete="off" placeholder="房號" aria-label="房號" />
            <!-- 手把輸入房號時取代上面的輸入框，一格一個數字（controls.js） -->
            <div id="lobby-code-pad"></div>
            <button class="lobby-sub-btn" type="submit" value="join">加入<span class="pad-hint">（Ⓨ）</span></button>
          </div>
          <div class="pad-code-help">↑↓ 改數字　←→ 移動　Ⓐ 加入　Ⓑ 取消</div>
          <!-- 手把操作說明：接上手把才顯示（style.css 的 .has-pad） -->
          <div class="pad-hint pad-help">🎮 左搖桿移動　右搖桿瞄準　Ⓐ普攻　Ⓧ技能　Ⓑ衝刺　Ⓨ大招</div>
          <!-- 選中角色的血量、速度和技能說明（lobby.js 產生），放在進場按鈕下面，手機不用捲動就按得到 -->
          <div id="lobby-error" role="alert"></div>
          <div id="lobby-kit"></div>
        </form>
        <!-- 等待、倒數、勝負結果，疊在遊戲畫面上 -->
        <div id="overlay" hidden></div>
      </main>

      <!-- 下方：操作區（左搖桿、右技能） -->
      <section id="controls">
        <div id="joystick"><div id="knob"></div></div>
        <div id="skills"></div>
      </section>
    </div>
    <script type="module" src="/src/client/main.js"></script>
  </body>
</html>
